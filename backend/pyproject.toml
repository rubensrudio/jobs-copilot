[project]
name = "jobs-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for Jobs Copilot"
authors = [
    { name = "Rubens Rudio", email = "rubensrudio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "mlflow>=3.16.1",
    "pinecone>=10.0.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "boto3>=1.43.108",
    "boto3-stubs[secretsmanager]>=1.43.108",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--junitxml=reports/junit.xml -m 'not external'"
testpaths = ["tests"]
markers = ["external: calls a real paid service (OpenAI, Pinecone, remote MLflow)"]