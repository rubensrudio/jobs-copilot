services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest # TODO pin: same version as mlflow in backend/uv.lock (TASK-002)
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  mongo-data:
  mlflow-data:
